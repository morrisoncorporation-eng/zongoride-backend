<!DOCTYPE html>
<html>
<head>
    <title>Scooter Fleet Live Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <style>
        #map {
            height: 100vh;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    const map = L.map('map').setView([40.7484, -73.9857], 14); // Centered on Empire State Building

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    let scooterLayer = L.geoJSON().addTo(map);

    function fetchScooterData() {
        fetch('/fleet/scooters/geojson/') // The URL for our new GeoJSON endpoint
            .then(response => response.json())
            .then(data => {
                scooterLayer.clearLayers(); // Clear existing markers
                scooterLayer.addData(data); // Add new GeoJSON data
            });
    }

    // Fetch the data every 5 seconds
    setInterval(fetchScooterData, 5000);

    // Initial data fetch
    fetchScooterData();
</script>

</body>
</html>
